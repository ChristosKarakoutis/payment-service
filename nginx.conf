# Per-client-IP limit for credential endpoints: 10 requests/minute, short bursts of 5.
limit_req_zone $binary_remote_addr zone=auth_credentials:10m rate=10r/m;

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /certs/localhost.pem;
    ssl_certificate_key /certs/localhost-key.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Brute-force and credential-stuffing protection. Exact-match regex beats the prefix block below.
    location ~ ^/api/auth/(login|register|refresh)$ {
        limit_req zone=auth_credentials burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://auth-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://payment-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}
