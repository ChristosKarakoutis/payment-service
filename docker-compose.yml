services:
  keygen:
    image: alpine:latest
    container_name: payment-system-keygen
    entrypoint: >
      sh -c "
        apk add --no-cache openssl > /dev/null 2>&1 &&
        openssl genpkey -algorithm RSA -out /keys/private.pem -pkeyopt rsa_keygen_bits:2048 > /dev/null 2>&1 &&
        openssl pkey -in /keys/private.pem -pubout -out /keys/public.pem > /dev/null 2>&1 &&
        chmod 644 /keys/*.pem
      "
    volumes:
      - shared_keys:/keys

  auth-db:
    image: postgres:16-alpine
    container_name: payment-system-auth-db
    environment:
      POSTGRES_DB: auth_system
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d auth_system"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

  payment-db:
    image: postgres:16-alpine
    container_name: payment-system-payment-db
    environment:
      POSTGRES_DB: payment_system
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d payment_system"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    container_name: payment-system-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_system
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_PRIVATE_KEY: file:/keys/private.pem
      JWT_PUBLIC_KEY: file:/keys/public.pem
    volumes:
      - shared_keys:/keys
    depends_on:
      keygen:
        condition: service_completed_successfully
      auth-db:
        condition: service_healthy

  payment-service:
    build: .
    container_name: payment-system-payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment_system
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_PUBLIC_KEY: file:/keys/public.pem
    volumes:
      - shared_keys:/keys
    depends_on:
      keygen:
        condition: service_completed_successfully
      payment-db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: payment-system-api-gateway
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/certs
    depends_on:
      - auth-service
      - payment-service

volumes:
  shared_keys:
  auth_postgres_data:
  payment_postgres_data: